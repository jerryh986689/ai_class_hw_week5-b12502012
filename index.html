<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI作業week5 · 出遊分帳</title>
<style>
:root{--ink:#172c28;--muted:#74817c;--green:#276750;--bg:#f5f6f2;--line:#e2e7df;--red:#b34b3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft JhengHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:9px 15px;background:white;color:var(--ink)}button:hover{background:#edf2e9}button:focus-visible,a:focus-visible{outline:3px solid #b8cc8b}button.primary{background:var(--green);color:white;border-color:var(--green)}button.danger{color:var(--red)}button.ghost{background:transparent}button:disabled{opacity:.45;cursor:not-allowed}header{background:white;border-bottom:1px solid var(--line)}.head{max-width:1180px;margin:auto;padding:20px 28px;display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;background:var(--green);color:white;display:grid;place-items:center;border-radius:11px;font-size:22px}.brand{font-weight:750;letter-spacing:.3px}.head small{margin-left:auto;color:var(--muted)}main{max-width:1180px;margin:auto;padding:35px 28px 70px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:750}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:0 0 15px}h3{margin:0 0 8px;font-size:18px}p{margin:7px 0}.muted,small{color:var(--muted)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.hero{margin:18px 0 28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:24px}.trip{display:flex;flex-direction:column;min-height:220px}.trip .bottom{margin-top:auto;padding-top:24px}.big{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums}.money{font-variant-numeric:tabular-nums;font-weight:650}.tag{font-size:12px;background:#eef3e9;color:var(--green);border-radius:20px;padding:3px 10px}.empty{text-align:center;padding:64px 20px;background:white;border:1px dashed #cbd5c7;border-radius:16px}.empty .symbol{font-size:38px;color:var(--green);margin-bottom:12px}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:25px 0;padding-bottom:12px}.tabs button{border:0;background:transparent;min-width:80px}.tabs .active{background:var(--ink);color:white}.stats{margin-bottom:22px}.stats .card{padding:20px 24px}.stats .big{margin-top:8px}.panel{margin-top:20px}.overview-panels{grid-template-columns:1fr 1fr}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-weight:500;color:var(--muted);font-size:12px}td,th{padding:15px 12px;border-bottom:1px solid var(--line)}td:first-child,th:first-child{padding-left:0}tr:last-child td{border-bottom:0}.positive{color:var(--green)}.negative{color:var(--red)}.notice{padding:12px 16px;background:#eef1e8;border-radius:9px;font-size:13px}.footer{margin-top:35px;color:var(--muted);font-size:12px}.filters{display:flex;gap:10px;margin:18px 0}.filters>*{flex:1;min-width:0}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #d5ddd2;background:white;border-radius:8px;padding:10px;color:var(--ink)}input[type=checkbox]{accent-color:var(--green);width:18px;height:18px}label{display:block;font-size:13px;margin-bottom:6px}textarea{resize:vertical;min-height:75px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.span2{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.member{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0;border-bottom:1px solid var(--line)}.split{display:grid;grid-template-columns:1fr 145px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.split label{display:flex;gap:9px;align-items:center;margin:0}.split input[type=number]{padding:7px}.transfer{display:flex;gap:18px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}.transfer .amount{margin-left:auto}.avatar{background:#edf2e8;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700}.error{color:var(--red);font-size:13px;white-space:pre-wrap}dialog{width:min(620px,calc(100% - 28px));max-height:90vh;border:0;border-radius:17px;padding:28px;color:var(--ink);box-shadow:0 20px 100px #142b2933}dialog::backdrop{background:#132b2866;backdrop-filter:blur(3px)}dialog h2{margin-bottom:22px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:10px;padding:12px 22px;z-index:20;max-width:90%;display:none}#storageWarning{background:#fff0e8;color:#9a3e2f;padding:12px;text-align:center}.note{white-space:pre-wrap;overflow-wrap:anywhere}.trip h3{overflow-wrap:anywhere}.subtle{font-size:12px;color:var(--muted)}@media(max-width:760px){.head{padding:16px 18px}.head small{display:none}main{padding:22px 18px 45px}h1{font-size:27px}.grid{grid-template-columns:1fr}.overview-panels{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{padding:13px 10px}.stats .big{font-size:19px}.stats small{font-size:11px}.card{padding:19px}.filters{flex-wrap:wrap}.filters input{flex-basis:100%}.fields{grid-template-columns:1fr}.span2{grid-column:auto}.transfer{flex-wrap:wrap;gap:10px}.transfer button{margin-left:auto}.tabs{gap:2px}.tabs button{flex:1;min-width:0;padding:9px}.big{font-size:26px}dialog{padding:22px}.table-wrap{margin-right:-5px}.hero .row{align-items:flex-start}}
</style></head><body><header><div class="head"><div class="logo">↗</div><div class="brand">AI作業week5</div><small>一起出發，輕鬆算清。</small></div></header><div id="storageWarning" hidden></div><main id="app"></main><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const KEY='travel-ledger-v1', $=s=>document.querySelector(s), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, money=n=>(n/10).toLocaleString('zh-TW',{minimumFractionDigits:1,maximumFractionDigits:1}), cats=['餐飲','交通','住宿','門票','購物','其他'];
let data={trips:[]}, current=null,tab='overview',filters={q:'',cat:'',payer:''}, draft=null;
try{let raw=localStorage.getItem(KEY);if(raw){let parsed=JSON.parse(raw);if(!Array.isArray(parsed.trips))throw Error();data=parsed;}}catch(e){$('#storageWarning').hidden=false;$('#storageWarning').textContent='無法讀取已存資料。請勿清除瀏覽器資料；本次操作可能無法保存。';}
const trip=()=>data.trips.find(t=>t.id===current), person=(t,id)=>t.members.find(m=>m.id===id)?.name||'未知成員', sum=(a,f)=>a.reduce((s,x)=>s+f(x),0), sorted=a=>[...a].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){$('#storageWarning').hidden=false;$('#storageWarning').textContent='儲存失敗：目前變更僅保留在此頁，關閉或重新整理可能遺失。';return false;}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
function finish(msg){let ok=persist();$('#modal').close();render();toast(ok?msg:msg+'（未能保存）')}
function units(v,zero=false){if(!/^\d+(\.\d)?$/.test(String(v).trim()))throw Error('金額須為非負數，最多一位小數。');let n=Math.round(Number(v)*10);if(!Number.isSafeInteger(n)||n>1e12||(!zero&&n===0))throw Error('請輸入有效且大於 0 的金額（上限 1000 億元）。');return n;}
function allocate(total,ids,payer){let shares={};if(!ids.length)return shares;let each=Math.round(total/ids.length);ids.forEach(id=>shares[id]=each);shares[payer]=(shares[payer]||0)+total-each*ids.length;return shares;}
function balances(t){let out=Object.fromEntries(t.members.map(m=>[m.id,{paid:0,owed:0,sent:0,received:0,net:0}]));t.expenses.forEach(e=>{out[e.payer].paid+=e.total;Object.entries(e.shares).forEach(([id,v])=>out[id].owed+=v)});t.payments.forEach(p=>{out[p.from].sent+=p.amount;out[p.to].received+=p.amount});Object.values(out).forEach(v=>v.net=v.paid-v.owed+v.sent-v.received);return out;}
function transfers(t){let b=balances(t),debt=t.members.filter(m=>b[m.id].net<0).map(m=>({id:m.id,n:-b[m.id].net})),credit=t.members.filter(m=>b[m.id].net>0).map(m=>({id:m.id,n:b[m.id].net})),out=[],i=0,j=0;while(i<debt.length&&j<credit.length){let n=Math.min(debt[i].n,credit[j].n);out.push({from:debt[i].id,to:credit[j].id,amount:n});debt[i].n-=n;credit[j].n-=n;if(!debt[i].n)i++;if(!credit[j].n)j++;}return out;}
const btn=(s,act,cls='',extra='')=>`<button class="${cls}" data-action="${act}" ${extra}>${s}</button>`, empty=(title,desc)=>`<div class="empty"><div class="symbol">◇</div><h3>${title}</h3><p class="muted">${desc}</p></div>`;
function render(){let t=trip();$('#app').innerHTML=t?detail(t):home();}
function home(){return `<div class="hero row between"><div><div class="eyebrow">YOUR TRAVEL LEDGER</div><h1>每趟旅程，都算得清楚。</h1><p class="muted">把回憶留給旅程，把帳目留在這裡。</p></div>${btn('＋ 建立旅行','new-trip','primary')}</div>${data.trips.length?`<div class="grid">${data.trips.map(t=>`<article class="card trip"><div class="row between"><span class="tag">${t.members.length} 位旅伴</span><span class="subtle">${esc(t.start||'未設定日期')}</span></div><h3 style="margin-top:20px">${esc(t.name)}</h3><div class="muted">${esc(t.end?'至 '+t.end:'一起記錄這趟旅程')}</div><div class="bottom row between"><div><small>旅行總支出</small><div class="money">NT$ ${money(sum(t.expenses,e=>e.total))}</div></div>${btn('查看旅程 ↗','open','','data-id="'+t.id+'"')}</div></article>`).join('')}</div>`:empty('第一趟旅程，從這裡開始','建立旅行並加入旅伴，即可開始記帳與分攤。')}<div class="row" style="margin-top:20px">${btn('載入範例旅行','sample','ghost')}<small>先用範例體驗均分、自訂金額與還款。</small></div>${footer()}`}
function footer(){return '<div class="footer">◉ 資料保存在此瀏覽器，不會跨裝置同步。清除瀏覽器資料可能造成遺失。</div>'}
function detail(t){let b=balances(t),total=sum(t.expenses,e=>e.total),pending=sum(Object.values(b),v=>Math.max(0,v.net));return `${btn('← 所有旅行','home','ghost')}<div class="hero row between"><div><div class="eyebrow">TRIP / 旅行帳本</div><h1>${esc(t.name)}</h1><p class="muted">${esc(t.start||'未設定日期')}${t.end?' — '+esc(t.end):''} · ${t.members.length} 位旅伴</p></div><div class="row">${btn('編輯旅行','edit-trip')}${btn('＋ 新增支出','expense','primary')}</div></div><div class="grid stats"><div class="card"><small>旅行總支出</small><div class="big">${money(total)} <small>元</small></div></div><div class="card"><small>尚待結算</small><div class="big">${money(pending)} <small>元</small></div></div><div class="card"><small>支出筆數</small><div class="big">${t.expenses.length} <small>筆</small></div></div></div><nav class="tabs">${[['overview','總覽'],['expenses','支出'],['settlement','結算'],['members','成員']].map(([id,name])=>btn(name,'tab',tab===id?'active':'',`data-id="${id}" aria-pressed="${tab===id}"`)).join('')}</nav>${tab==='overview'?overview(t,b):tab==='expenses'?expenses(t):tab==='members'?members(t):settlement(t,b)}${footer()}`}
function balanceTable(t,b){return t.members.length?`<div class="table-wrap"><table><thead><tr><th>旅伴</th><th>已代墊</th><th>應負擔</th><th>已還款</th><th>已收款</th><th>目前結算</th></tr></thead><tbody>${t.members.map(m=>{let v=b[m.id];return `<tr><td>${esc(m.name)}${m.active?'':' <small>不分帳</small>'}</td><td>${money(v.paid)}</td><td>${money(v.owed)}</td><td>${money(v.sent)}</td><td>${money(v.received)}</td><td class="money ${v.net>0?'positive':v.net<0?'negative':''}">${v.net===0?'已結清':(v.net>0?'應收 ':'應付 ')+money(Math.abs(v.net))}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">尚未加入旅伴，請到成員分頁新增。</p>'}
function overview(t,b){return `<section class="card"><div class="row between"><h2>旅伴帳務一覽</h2><small>金額單位：新臺幣元</small></div>${balanceTable(t,b)}</section><div class="grid panel overview-panels"><section class="card"><h2>旅行筆記</h2><p class="note muted">${esc(t.note||'還沒有備註。可以記下集合地點或這趟旅行的小提醒。')}</p></section><section class="card"><h2>帳目管理</h2><p class="muted">刪除旅行會移除所有相關資料，無法復原。</p>${btn('刪除這趟旅行','delete-trip','danger')}</section></div>`}
function expenseRows(t){let list=sorted(t.expenses).filter(e=>e.title.toLowerCase().includes(filters.q.toLowerCase())&&(!filters.cat||e.category===filters.cat)&&(!filters.payer||e.payer===filters.payer));return list.length?`<div class="table-wrap"><table><thead><tr><th>支出項目</th><th>日期 / 分類</th><th>付款人</th><th>金額</th><th>操作</th></tr></thead><tbody>${list.map(e=>`<tr><td><strong>${esc(e.title)}</strong><div class="subtle">${e.participants.length} 人 · ${e.mode==='equal'?'均分':'自訂'}</div></td><td>${esc(e.date)}<div class="subtle">${esc(e.category)}</div></td><td>${esc(person(t,e.payer))}</td><td class="money">${money(e.total)}</td><td>${btn('查看 / 編輯','edit-expense','',`data-id="${e.id}"`)} ${btn('刪除','delete-expense','danger',`data-id="${e.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty(t.expenses.length?'沒有符合的支出':'還沒有支出',t.expenses.length?'試試其他搜尋字詞或篩選條件。':'記下第一筆費用，開始分攤。')}
function expenses(t){return `<section class="card"><div class="row between"><h2>支出明細</h2><small>篩選不影響整趟旅行結算</small></div><div class="filters"><input id="search" aria-label="搜尋項目" placeholder="搜尋支出項目…" value="${esc(filters.q)}"><select id="filterCat" aria-label="分類篩選"><option value="">所有分類</option>${cats.map(c=>`<option ${filters.cat===c?'selected':''}>${c}</option>`).join('')}</select><select id="filterPayer" aria-label="付款人篩選"><option value="">所有付款人</option>${options(t,filters.payer)}</select></div><div id="expenseList">${expenseRows(t)}</div></section>`}
function members(t){return `<section class="card"><div class="row between"><h2>這趟的旅伴</h2>${btn('＋ 新增成員','add-member','primary')}</div><p class="notice">關閉「參加分帳」只影響新的分攤；既有帳目、還款及債務都會保留。</p>${t.members.map(m=>`<div class="member"><div class="row"><span class="avatar">${esc(m.name.slice(0,1))}</span><div><strong>${esc(m.name)}</strong><div class="subtle">${m.active?'參與新支出的預設分攤':'不參與新的分攤'}</div></div></div><div class="row">${btn('改名','rename','',`data-id="${m.id}"`)}<label class="row" style="margin:0"><input type="checkbox" data-member="${m.id}" ${m.active?'checked':''}>參加分帳</label></div></div>`).join('')||'<p class="muted">加入第一位旅伴，開始規劃這趟旅程。</p>'}</section>`}
function settlement(t,b){let list=transfers(t);return `<section class="card"><div class="row between"><h2>剩餘轉帳建議</h2><div class="row">${btn('複製結算摘要','copy')}${btn('＋ 記錄還款','payment','primary')}</div></div><p class="muted">按整趟旅程的淨額結算，以下是一組可結清的付款方式。</p>${list.length?list.map(p=>`<div class="transfer"><span class="avatar">↗</span><div><strong>${esc(person(t,p.from))} → ${esc(person(t,p.to))}</strong><div class="subtle">尚需支付</div></div><div class="money amount">${money(p.amount)} 元</div>${btn('記錄還款','suggest-payment','',`data-from="${p.from}" data-to="${p.to}" data-amount="${p.amount}"`)}</div>`).join(''):'<div class="notice" style="margin-top:18px">✓ 所有成員已結清</div>'}</section><section class="card panel"><h2>還款紀錄</h2>${t.payments.length?`<div class="table-wrap"><table><thead><tr><th>日期</th><th>款項往來</th><th>金額</th><th>操作</th></tr></thead><tbody>${sorted(t.payments).map(p=>`<tr><td>${p.date}</td><td>${esc(person(t,p.from))} → ${esc(person(t,p.to))}</td><td class="money">${money(p.amount)}</td><td>${btn('撤銷','revoke','danger',`data-id="${p.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">還沒有還款紀錄。此處只記錄實際已發生的付款。</p>'}</section>`}
function options(t,selected,blank=false){return (blank?'<option value="">請選擇</option>':'')+t.members.map(m=>`<option value="${m.id}" ${selected===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}
function show(title,body,save){$('#modal').innerHTML=`<form id="dialogForm"><div class="row between"><h2>${title}</h2><button type="button" data-action="close" aria-label="關閉">×</button></div>${body}<p id="formError" class="error" role="alert"></p><div class="actions"><button type="button" data-action="close">取消</button><button class="primary" type="submit">${save||'儲存'}</button></div></form>`;$('#modal').showModal();}
function field(label,id,value='',type='text',extra=''){return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function submit(fn){$('#dialogForm').onsubmit=e=>{e.preventDefault();try{fn()}catch(err){$('#formError').textContent=err.message}}}
function tripForm(edit=false){let t=edit?trip():{name:'',start:'',end:'',note:''};show(edit?'編輯旅行':'建立新旅行',`<div class="fields"><div class="span2">${field('旅行名稱 *','tripName',t.name,'text','required maxlength="80"')}</div>${field('開始日期','tripStart',t.start,'date')}${field('結束日期','tripEnd',t.end,'date')}<div class="span2"><label for="tripNote">備註</label><textarea id="tripNote" maxlength="2000">${esc(t.note)}</textarea></div></div>`);submit(()=>{let name=$('#tripName').value.trim(),start=$('#tripStart').value,end=$('#tripEnd').value;if(!name)throw Error('請輸入旅行名稱。');if(start&&end&&end<start)throw Error('結束日期不得早於開始日期。');Object.assign(t,{name,start,end,note:$('#tripNote').value.trim()});if(!edit){Object.assign(t,{id:uid(),members:[],expenses:[],payments:[]});data.trips.push(t);current=t.id;tab='members';}finish(edit?'旅行已更新':'旅行已建立，接著加入旅伴。')})}
function memberForm(id){let t=trip(),m=t.members.find(m=>m.id===id);show(m?'修改成員姓名':'新增旅伴',field('姓名或暱稱 *','memberName',m?.name||'','text','required maxlength="30"'));submit(()=>{let name=$('#memberName').value.trim();if(!name)throw Error('請輸入姓名。');if(t.members.some(x=>x.id!==id&&x.name===name))throw Error('這趟旅行已有相同姓名的成員。');if(m)m.name=name;else t.members.push({id:uid(),name,active:true});finish('成員資料已保存')})}
function expenseForm(id){let t=trip(),e=t.expenses.find(e=>e.id===id);if(!e&&!t.members.length)return toast('請先加入成員');if(!e&&!t.members.some(m=>m.active))return toast('請先開啟至少一位成員參加分帳');draft=e?JSON.parse(JSON.stringify(e)):{id:uid(),title:'',total:0,payer:t.members[0].id,date:today(),category:'其他',participants:t.members.filter(m=>m.active).map(m=>m.id),mode:'equal',shares:{},note:'',created:Date.now()};draft.eligible=t.members.filter(m=>m.active||draft.participants.includes(m.id)).map(m=>m.id);draft.values=Object.fromEntries(t.members.map(m=>[m.id,((draft.shares[m.id]||0)/10).toFixed(1)]));show(e?'支出詳情 / 編輯':'新增支出',`<div class="fields">${field('項目名稱 *','expenseTitle',draft.title,'text','required maxlength="100"')}${field('金額（元）*','expenseTotal',e?(e.total/10).toFixed(1):'','number','required min="0.1" step="0.1"')}<div><label for="expensePayer">付款人 *</label><select id="expensePayer">${options(t,draft.payer)}</select></div>${field('日期 *','expenseDate',draft.date,'date','required')}<div><label for="expenseCategory">分類</label><select id="expenseCategory">${cats.map(c=>`<option ${c===draft.category?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="expenseMode">分攤方式</label><select id="expenseMode"><option value="equal" ${draft.mode==='equal'?'selected':''}>均分</option><option value="custom" ${draft.mode==='custom'?'selected':''}>自訂金額</option></select></div></div><div class="row between" style="margin-top:22px"><strong>分攤成員</strong><button type="button" data-action="redistribute">重新分配</button></div><div id="splits"></div><p id="splitStatus" class="notice"></p><label for="expenseNote">備註</label><textarea id="expenseNote" maxlength="2000">${esc(draft.note)}</textarea>`);drawSplits();$('#expenseTotal').oninput=updateSplitStatus;$('#expensePayer').onchange=updateSplitStatus;$('#expenseMode').onchange=()=>{let mode=$('#expenseMode').value;if(mode==='custom'){let shares=allocate(readTotal(),draft.participants,$('#expensePayer').value);draft.values=Object.fromEntries(t.members.map(m=>[m.id,(Math.max(0,shares[m.id]||0)/10).toFixed(1)]));}draft.mode=mode;drawSplits()};submit(()=>{let title=$('#expenseTitle').value.trim();if(!title)throw Error('請輸入項目名稱。');let total=units($('#expenseTotal').value),payer=$('#expensePayer').value;if(!draft.participants.length)throw Error('請選擇至少一位分攤成員。');let shares=draft.mode==='equal'?allocate(total,draft.participants,payer):Object.fromEntries(draft.participants.map(id=>[id,units(draft.values[id],true)]));if(sum(Object.values(shares),v=>v)!==total)throw Error('自訂分攤總和必須等於支出金額。');let result={id:draft.id,title,total,payer,date:$('#expenseDate').value,category:$('#expenseCategory').value,participants:[...draft.participants],mode:draft.mode,shares,note:$('#expenseNote').value.trim(),created:draft.created};if(e)t.expenses[t.expenses.indexOf(e)]=result;else t.expenses.push(result);finish('支出已保存')})}
function readTotal(){try{return units($('#expenseTotal').value,true)}catch{return 0}}
function drawSplits(){let t=trip();$('#splits').innerHTML=t.members.map(m=>{let selected=draft.participants.includes(m.id),eligible=draft.eligible.includes(m.id);return `<div class="split"><label><input type="checkbox" data-split="${m.id}" ${selected?'checked':''} ${eligible?'':'disabled'}>${esc(m.name)} ${eligible?'':'<small>未開啟分帳</small>'}</label>${draft.mode==='custom'&&selected?`<input aria-label="${esc(m.name)}的分攤金額" type="number" min="0" step="0.1" data-share="${m.id}" value="${esc(draft.values[m.id]||'0.0')}">`:`<span class="money" data-display="${m.id}"></span>`}</div>`}).join('');updateSplitStatus()}
function updateSplitStatus(){if(!$('#splitStatus'))return;let total=readTotal(),ids=draft.participants,payer=$('#expensePayer').value;if(draft.mode==='equal'){let shares=allocate(total,ids,payer),tail=ids.length?total-Math.round(total/ids.length)*ids.length:0;document.querySelectorAll('[data-display]').forEach(el=>el.textContent=shares[el.dataset.display]!==undefined?money(shares[el.dataset.display])+' 元':'—');$('#splitStatus').textContent=ids.length?`共 ${ids.length} 人分攤。四捨五入調整 ${tail>0?'+':''}${money(tail)} 元由 ${person(trip(),payer)} 承擔。`:'請選擇至少一位分攤成員。';}else{try{let totalShares=sum(ids,id=>units(draft.values[id]||'0',true)),diff=total-totalShares;$('#splitStatus').textContent=diff===0?'✓ 分攤總額一致':diff>0?`尚差 ${money(diff)} 元，請調整分攤金額。`:`超出 ${money(-diff)} 元，請調整分攤金額。`}catch{$('#splitStatus').textContent='金額須為非負數，最多一位小數。'}}}
function paymentForm(from,to,amount){let t=trip();if(t.members.length<2)return toast('至少需要兩位成員才能記錄還款');show('記錄還款',`<p class="notice">僅記錄實際發生的付款；若當場找零，可記錄淨還款金額。</p><div class="fields" style="margin-top:18px"><div><label for="payFrom">付款人 *</label><select id="payFrom">${options(t,from,true)}</select></div><div><label for="payTo">收款人 *</label><select id="payTo">${options(t,to,true)}</select></div>${field('還款金額 *','payAmount',amount?(amount/10).toFixed(1):'','number','required min="0.1" step="0.1"')}${field('日期 *','payDate',today(),'date','required')}</div>`);submit(()=>{let from=$('#payFrom').value,to=$('#payTo').value,amount=units($('#payAmount').value);if(!from||!to)throw Error('請選擇付款人及收款人。');if(from===to)throw Error('付款人與收款人不得相同。');let b=balances(t),over=Math.max(amount-Math.max(0,-b[from].net),amount-Math.max(0,b[to].net));if(over>0&&!confirm(`本次還款超出目前可結算金額 ${money(over)} 元，可能產生反向應收／應付款。是否繼續？`))return;t.payments.push({id:uid(),from,to,amount,date:$('#payDate').value,created:Date.now()});finish('還款已記錄，結算已更新')})}
function deleteTrip(){let t=trip();show('刪除旅行',`<p class="notice">此操作會永久刪除所有成員、支出及還款紀錄，無法復原。</p><p>請輸入「<strong>${esc(t.name)}</strong>」以確認。</p>${field('旅行名稱','confirmName','','text','required')}`,'永久刪除');submit(()=>{if($('#confirmName').value!==t.name)throw Error('旅行名稱不符。');data.trips=data.trips.filter(x=>x.id!==t.id);current=null;finish('旅行已刪除')})}
function sample(){let ids=[uid(),uid(),uid()],t={id:uid(),name:'台南兩天一夜',start:today(),end:today(),note:'散步、吃美食，也把旅費記清楚。這是可自由修改的範例旅行。',members:['小明','小華','小美'].map((name,i)=>({id:ids[i],name,active:true})),expenses:[],payments:[]};function add(title,total,payer,participants,category,shares){t.expenses.push({id:uid(),title,total,payer,participants,category,shares:shares||allocate(total,participants,payer),mode:shares?'custom':'equal',date:today(),note:'',created:Date.now()+t.expenses.length})}add('一晚住宿',36000,ids[0],ids,'住宿');add('車站到民宿的計程車',2500,ids[1],[ids[1],ids[2]],'交通');add('巷口晚餐',9800,ids[2],ids,'餐飲',{[ids[0]]:2800,[ids[1]]:3500,[ids[2]]:3500});t.payments.push({id:uid(),from:ids[1],to:ids[0],amount:5000,date:today(),created:Date.now()});data.trips.push(t);current=t.id;tab='overview';finish('範例旅行已載入')}
async function copySummary(){let t=trip(),list=transfers(t),text=`AI作業week5｜${t.name}\n總支出：${money(sum(t.expenses,e=>e.total))} 元\n`+(list.length?'已記錄還款後，尚需結算：\n'+list.map(p=>`${person(t,p.from)} → ${person(t,p.to)}：${money(p.amount)} 元`).join('\n'):'所有成員已結清');try{await navigator.clipboard.writeText(text);toast('結算摘要已複製')}catch{show('手動複製摘要',`<label for="copyText">請選取以下文字並複製</label><textarea id="copyText" style="min-height:200px" readonly>${esc(text)}</textarea>`,'完成');submit(()=>$('#modal').close());$('#copyText').select()}}
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.q=e.target.value;$('#expenseList').innerHTML=expenseRows(trip())}if(e.target.dataset.share){draft.values[e.target.dataset.share]=e.target.value;updateSplitStatus()}});
document.addEventListener('change',e=>{let el=e.target;if(el.dataset.member){trip().members.find(m=>m.id===el.dataset.member).active=el.checked;persist();render()}if(el.dataset.split){let id=el.dataset.split;if(el.checked){draft.participants.push(id);draft.values[id]='0.0'}else draft.participants=draft.participants.filter(x=>x!==id);drawSplits()}if(el.id==='filterCat'||el.id==='filterPayer'){filters[el.id==='filterCat'?'cat':'payer']=el.value;$('#expenseList').innerHTML=expenseRows(trip())}});
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id,t=trip();if(a==='close')$('#modal').close();else if(a==='new-trip')tripForm();else if(a==='edit-trip')tripForm(true);else if(a==='open'){current=id;tab='overview';filters={q:'',cat:'',payer:''};render()}else if(a==='home'){current=null;render()}else if(a==='tab'){tab=id;render()}else if(a==='add-member')memberForm();else if(a==='rename')memberForm(id);else if(a==='expense')expenseForm();else if(a==='edit-expense')expenseForm(id);else if(a==='delete-expense'){if(confirm('確定刪除此支出？既有還款將保留，結算會重新計算。')){t.expenses=t.expenses.filter(x=>x.id!==id);finish('支出已刪除')}}else if(a==='payment')paymentForm();else if(a==='suggest-payment')paymentForm(el.dataset.from,el.dataset.to,Number(el.dataset.amount));else if(a==='revoke'){if(confirm('確定撤銷這筆還款？結算將重新計算。')){t.payments=t.payments.filter(x=>x.id!==id);finish('還款已撤銷')}}else if(a==='delete-trip')deleteTrip();else if(a==='sample')sample();else if(a==='copy')copySummary();else if(a==='redistribute'){if(draft.mode==='custom'&&!confirm('重新分配將覆蓋手動金額，並切換為均分模式。是否繼續？'))return;draft.mode='equal';$('#expenseMode').value='equal';drawSplits()}});
render();
</script></body></html>
